nextest-version = { required = "0.9.90" }

[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"
leak-timeout = "300ms"
