# SPDX-License-Identifier: MIT OR Apache-2.0
name: Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: "1.98.0"
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov@0.8.7,nextest@0.9.143

      - name: Generate LCOV and summary
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest --workspace --all-features --locked --no-tests=pass --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --summary-only | tee target/llvm-cov/summary.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llvm-cov
          path: target/llvm-cov/
          if-no-files-found: error
          retention-days: 30
