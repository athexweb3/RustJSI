# SPDX-License-Identifier: MIT OR Apache-2.0
name: Miri

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: miri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  miri:
    name: miri (safe/model crates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly + Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: nightly-2026-08-27
          components: miri, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false

      - name: cargo miri test
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        run: |
          cargo miri test \
            --locked \
            -p rustjsi-core \
            -p rustjsi-runtime \
            -p rustjsi-host \
            -p rustjsi-embed \
            -p rustjsi-module \
            -p rustjsi-ir \
            -p rustjsi-codegen \
            -p rustjsi-testkit
