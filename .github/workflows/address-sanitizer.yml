# SPDX-License-Identifier: MIT OR Apache-2.0
name: AddressSanitizer

on:
  pull_request:
    paths:
      - ".github/workflows/address-sanitizer.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "backend/**"
      - "backend-jsc/**"
      - "host/**"
      - "testkit/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/address-sanitizer.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "backend/**"
      - "backend-jsc/**"
      - "host/**"
      - "testkit/**"
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

concurrency:
  group: asan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Zsanitizer=address -Cdebuginfo=1"

jobs:
  jsc:
    name: JavaScriptCore ASan
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: nightly-2026-08-27
          components: rust-src
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          key: jsc-asan-nightly-2026-08-27

      - name: Test JavaScriptCore with AddressSanitizer
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1"
        run: >-
          cargo +nightly-2026-08-27 test
          -Zbuild-std
          --target aarch64-apple-darwin
          -p rustjsi-backend-jsc
          --features experimental-jsc
          --lib
          --tests
          --locked

      - name: Check foreign host lifecycle for leaks
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/backend-jsc/tests/lsan.supp:print_suppressions=1"
        run: >-
          cargo +nightly-2026-08-27 test
          -Zbuild-std
          --target aarch64-apple-darwin
          -p rustjsi-backend-jsc
          --features experimental-jsc
          --lib
          --locked
          foreign_
