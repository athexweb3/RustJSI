# SPDX-License-Identifier: MIT OR Apache-2.0
name: ThreadSanitizer

on:
  pull_request:
    paths:
      - ".github/workflows/thread-sanitizer.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "backend/**"
      - "backend-jsc/**"
      - "host/**"
      - "testkit/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/thread-sanitizer.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "backend/**"
      - "backend-jsc/**"
      - "host/**"
      - "testkit/**"
  workflow_dispatch:

concurrency:
  group: tsan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Zsanitizer=thread -Cdebuginfo=1"

jobs:
  jsc:
    name: JavaScriptCore TSan (experimental)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: nightly-2026-08-27
          components: rust-src
          targets: aarch64-apple-darwin

      - name: Pin nightly compiler paths
        run: |
          echo "RUSTC=$(rustup which --toolchain nightly-2026-08-27 rustc)" >> "$GITHUB_ENV"
          echo "RUSTDOC=$(rustup which --toolchain nightly-2026-08-27 rustdoc)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          key: jsc-tsan-nightly-2026-08-27

      - name: Check focused foreign host lifecycle with ThreadSanitizer
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: >-
          rustup run nightly-2026-08-27 cargo test
          -Zbuild-std
          --target aarch64-apple-darwin
          -p rustjsi-backend-jsc
          --features experimental-jsc
          --lib
          --locked
          foreign_

      - name: Test standalone JavaScriptCore with ThreadSanitizer
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: >-
          rustup run nightly-2026-08-27 cargo test
          -Zbuild-std
          --target aarch64-apple-darwin
          -p rustjsi-backend-jsc
          --features experimental-jsc
          --lib
          --tests
          --locked
