# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "rustjsi-backend-jsc"
description = "JavaScriptCore engine backend for RustJSI."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
experimental-jsc = ["dep:rustjsi-backend", "dep:rustjsi-host"]

[dependencies]
rustjsi-backend = { path = "../backend", version = "=0.0.0", optional = true }
rustjsi-host = { path = "../host", version = "=0.0.0", optional = true }

[dev-dependencies]
rustjsi-testkit = { path = "../testkit", version = "=0.0.0" }

[[bench]]
name = "boundary"
harness = false
required-features = ["experimental-jsc"]

[[bench]]
name = "root_release"
harness = false
required-features = ["experimental-jsc"]

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"
future_incompatible = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
